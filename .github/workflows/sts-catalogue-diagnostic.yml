name: STS public catalogue diagnostic
on:
  push:
    branches:
      - research/sts-20261118-catalogue-compare
  workflow_dispatch:
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python scripts/sts_site_diagnostic.py
      - uses: actions/upload-artifact@v4
        with:
          name: sts-diagnostic
          path: research/sts/diagnostic.json
